name: Portfolio verification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - '.github/workflows/portfolio-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Verify static export
        run: npm run build
      - name: Run geometry and privacy-contract tests
        run: npm test
